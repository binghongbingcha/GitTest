<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coze智能客服</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- 顶部栏 -->
        <div class="chat-header">
            <div class="header-info">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bot-info">
                    <h3>智能客服</h3>
                    <span class="status" id="status">在线</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="action-btn" onclick="clearChat()" title="清空对话">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="action-btn" onclick="toggleSettings()" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>

        <!-- 聊天消息区域 -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <p>您好！我是智能客服助手，很高兴为您服务！</p>
                    <p>请告诉我您需要什么帮助？</p>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-area">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="请输入您的问题..." maxlength="500">
                <button id="sendButton" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-info">
                <span class="typing-indicator" id="typingIndicator" style="display: none;">
                    <i class="fas fa-ellipsis-h"></i> 正在输入...
                </span>
                <span class="char-count" id="charCount">0/500</span>
            </div>
        </div>

        <!-- 快捷回复 -->
        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" onclick="sendQuickReply('我想了解产品功能')">
                产品功能
            </button>
            <button class="quick-reply-btn" onclick="sendQuickReply('如何使用这个系统？')">
                使用帮助
            </button>
            <button class="quick-reply-btn" onclick="sendQuickReply('我遇到了技术问题')">
                技术支持
            </button>
            <button class="quick-reply-btn" onclick="sendQuickReply('联系人工客服')">
                人工客服
            </button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div class="settings-content">
            <div class="settings-header">
                <h3>设置</h3>
                <button class="close-btn" onclick="toggleSettings()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label>连接模式</label>
                    <select id="connectionMode">
                        <option value="http">HTTP</option>
                        <option value="websocket">WebSocket</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>消息提示音</label>
                    <input type="checkbox" id="soundEnabled" checked>
                </div>
                <div class="setting-item">
                    <label>自动滚动</label>
                    <input type="checkbox" id="autoScroll" checked>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>正在处理您的请求...</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
