  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - coze-network

  # 可选：添加Nginx反向代理
  # nginx:
  #   image: nginx:alpine
  #   container_name: coze-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - coze-customer-service
  #   networks:
  #     - coze-network

networks:
  coze-network:
    driver: bridge

volumes:
  redis_data: